<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スマートタスク管理</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー・進捗 */
    .header-card {
      background: var(--card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }

    .date-display {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .header-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    /* タブ切り替え */
    .tabs {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.08);
    }

    /* 入力フォーム */
    .input-card {
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select, input[type="date"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }

    input[type="text"] {
      flex: 1;
    }

    input[type="text"]:focus, select:focus, input[type="date"]:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* タスクリスト */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--card);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.04);
      cursor: grab;
      user-select: none;
      transition: transform 0.15s, opacity 0.15s;
    }

    .task-item:active {
      cursor: grabbing;
    }

    .task-item.dragging {
      opacity: 0.4;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .task-title {
      font-size: 1rem;
      word-break: break-word;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      gap: 6px;
      font-size: 0.75rem;
      align-items: center;
    }

    .badge-repeat {
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .badge-date {
      color: var(--muted);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <div class="header-card">
    <div class="date-display" id="currentDate"></div>
    <div class="header-title">
      <span>今日の達成状況</span>
      <span id="progressCount" style="font-size: 1rem; color: var(--primary);">0 / 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressPercent">0% 完了</div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('all')">すべて</button>
    <button class="tab-btn" onclick="switchTab('daily')">毎日</button>
    <button class="tab-btn" onclick="switchTab('weekly')">週間</button>
    <button class="tab-btn" onclick="switchTab('monthly')">月間</button>
  </div>

  <!-- タスク追加エリア -->
  <div class="input-card">
    <input type="text" id="taskInput" placeholder="新しいタスクを入力..." />
    <div class="input-row">
      <select id="repeatSelect" style="flex: 1;">
        <option value="none">単発タスク</option>
        <option value="daily">毎日ルーティン</option>
        <option value="weekly">週間ルーティン</option>
        <option value="monthly">月間ルーティン</option>
      </select>
      <input type="date" id="dateInput" style="flex: 1;" />
    </div>
    <button class="btn-submit" id="addBtn">タスクを追加</button>
  </div>

  <!-- リスト -->
  <div class="task-list" id="taskList"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks_v2')) || [];
  let currentTab = 'all';

  const taskInput = document.getElementById('taskInput');
  const repeatSelect = document.getElementById('repeatSelect');
  const dateInput = document.getElementById('dateInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const progressBar = document.getElementById('progressBar');
  const progressCount = document.getElementById('progressCount');
  const progressPercent = document.getElementById('progressPercent');
  const currentDateEl = document.getElementById('currentDate');

  // 本日の日付表示
  const now = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
  currentDateEl.innerText = now.toLocaleDateString('ja-JP', options);

  function saveTasks() {
    localStorage.setItem('tasks_v2', JSON.stringify(tasks));
    updateProgress();
  }

  function updateProgress() {
    if (tasks.length === 0) {
      progressBar.style.width = '0%';
      progressCount.innerText = '0 / 0';
      progressPercent.innerText = '0% 完了';
      return;
    }
    const completedCount = tasks.filter(t => t.completed).length;
    const percent = Math.round((completedCount / tasks.length) * 100);
    progressBar.style.width = `${percent}%`;
    progressCount.innerText = `${completedCount} / ${tasks.length}`;
    progressPercent.innerText = `${percent}% 完了`;
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderTasks();
  }

  function renderTasks() {
    taskList.innerHTML = '';
    const filteredTasks = tasks.map((task, originalIndex) => ({ ...task, originalIndex }))
      .filter(item => {
        if (currentTab === 'all') return true;
        return item.repeat === currentTab;
      });

    if (filteredTasks.length === 0) {
      taskList.innerHTML = '<div class="empty-state">タスクがありません</div>';
      updateProgress();
      return;
    }

    filteredTasks.forEach((task) => {
      const el = document.createElement('div');
      el.className = 'task-item';
      el.draggable = true;
      el.dataset.index = task.originalIndex;

      const repeatLabels = {
        none: '単発',
        daily: '毎日',
        weekly: '週間',
        monthly: '月間'
      };

      const dateHtml = task.dueDate ? `<span class="badge-date">📅 ${task.dueDate}</span>` : '';

      el.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.originalIndex})">
          <div class="task-content">
            <span class="task-title ${task.completed ? 'completed' : ''}">${escapeHtml(task.title)}</span>
            <div class="task-meta">
              <span class="badge-repeat">${repeatLabels[task.repeat]}</span>
              ${dateHtml}
            </div>
          </div>
        </div>
        <button class="btn-delete" onclick="deleteTask(${task.originalIndex})">✕</button>
      `;

      addDragEvents(el);
      taskList.appendChild(el);
    });

    updateProgress();
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[m]);
  }

  function addTask() {
    const title = taskInput.value.trim();
    if (!title) return;

    tasks.push({
      title: title,
      repeat: repeatSelect.value,
      dueDate: dateInput.value,
      completed: false
    });

    saveTasks();
    renderTasks();
    taskInput.value = '';
    dateInput.value = '';
    repeatSelect.value = 'none';
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTask();
  });

  // ドラッグ＆ドロップ並び替え
  let draggedItem = null;

  function addDragEvents(item) {
    item.addEventListener('dragstart', () => {
      draggedItem = item;
      setTimeout(() => item.classList.add('dragging'), 0);
    });

    item.addEventListener('dragend', () => {
      draggedItem = null;
      item.classList.remove('dragging');
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(taskList, e.clientY);
      if (afterElement == null) {
        taskList.appendChild(draggedItem);
      } else {
        taskList.insertBefore(draggedItem, afterElement);
      }
    });

    item.addEventListener('drop', () => {
      const newOrder = Array.from(taskList.children).map(child => tasks[child.dataset.index]);
      tasks = newOrder;
      saveTasks();
      renderTasks();
    });
  }

  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.task-item:not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  renderTasks();
</script>

</body>
</html>
