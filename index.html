<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.5rem;
      color: #0f172a;
    }

    .input-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    .row {
      display: flex;
      gap: 8px;
    }

    button.btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-add:hover {
      background: var(--primary-hover);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
      cursor: grab;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .task-item:active {
      cursor: grabbing;
    }

    .task-item.dragging {
      opacity: 0.5;
      transform: scale(0.98);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task-title {
      font-size: 1rem;
      word-break: break-word;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>タスク管理</h1>

  <div class="input-card">
    <input type="text" id="taskInput" placeholder="新しいタスクを入力..." />
    <div class="row">
      <select id="repeatSelect">
        <option value="none">繰り返しなし</option>
        <option value="daily">毎日</option>
        <option value="weekly">毎週</option>
        <option value="monthly">毎月</option>
      </select>
      <button class="btn-add" id="addBtn" style="flex: 1;">追加</button>
    </div>
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

  const taskInput = document.getElementById('taskInput');
  const repeatSelect = document.getElementById('repeatSelect');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');

  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function renderTasks() {
    taskList.innerHTML = '';
    tasks.forEach((task, index) => {
      const el = document.createElement('div');
      el.className = 'task-item';
      el.draggable = true;
      el.dataset.index = index;

      const repeatLabels = {
        none: '',
        daily: '毎日',
        weekly: '毎週',
        monthly: '毎月'
      };

      const badgeHtml = task.repeat !== 'none' ? `<span class="badge">${repeatLabels[task.repeat]}</span>` : '';

      el.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
          <span class="task-title ${task.completed ? 'completed' : ''}">${escapeHtml(task.title)}</span>
          ${badgeHtml}
        </div>
        <button class="btn-delete" onclick="deleteTask(${index})">✕</button>
      `;

      addDragEvents(el);
      taskList.appendChild(el);
    });
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[m]);
  }

  function addTask() {
    const title = taskInput.value.trim();
    if (!title) return;

    tasks.push({
      title: title,
      repeat: repeatSelect.value,
      completed: false
    });

    saveTasks();
    renderTasks();
    taskInput.value = '';
    repeatSelect.value = 'none';
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    saveTasks();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    renderTasks();
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTask();
  });

  // ドラッグ＆ドロップ並び替え
  let draggedItem = null;

  function addDragEvents(item) {
    item.addEventListener('dragstart', () => {
      draggedItem = item;
      setTimeout(() => item.classList.add('dragging'), 0);
    });

    item.addEventListener('dragend', () => {
      draggedItem = null;
      item.classList.remove('dragging');
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(taskList, e.clientY);
      if (afterElement == null) {
        taskList.appendChild(draggedItem);
      } else {
        taskList.insertBefore(draggedItem, afterElement);
      }
    });

    item.addEventListener('drop', () => {
      const newOrder = Array.from(taskList.children).map(child => tasks[child.dataset.index]);
      tasks = newOrder;
      saveTasks();
      renderTasks();
    });
  }

  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.task-item:not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  renderTasks();
</script>

</body>
</html>
