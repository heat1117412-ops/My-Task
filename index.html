<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Tailwind CSS CDN -->

  <!-- Lucide Icons -->

  <!-- SortableJS (ドラッグ＆ドロップ) -->

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCg2kOA4IVNwMsr4sPzLTpOrAw8u-b8_yU",
      authDomain: "my-task-app-79a0b.firebaseapp.com",
      projectId: "my-task-app-79a0b",
      storageBucket: "my-task-app-79a0b.firebasestorage.app",
      messagingSenderId: "916447005555",
      appId: "1:916447005555:web:4cc521455ed756ea631306"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // グローバルにFirestore操作を公開
    window.db = db;
    window.fsCollection = collection;
    window.fsOnSnapshot = onSnapshot;
    window.fsDoc = doc;
    window.fsSetDoc = setDoc;
    window.fsDeleteDoc = deleteDoc;

    // Firebase同期の初期化呼び出し
    if (window.initFirebaseSync) {
      window.initFirebaseSync();
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }

    .task-item {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    .task-item.removing {

      padding-top: 0;

      margin-top: 0;

      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 4px;

    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;

  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-28 select-none">

  <!-- ヘッダー -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 px-4 py-3 sm:px-6">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">

          <i data-lucide="check-square" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight text-slate-900">マイタスク</h1>
          <p class="text-[11px] text-slate-500 font-medium" id="current-date-text">----年--月--日</p>
        </div>
      </div>
      
      <!-- 今日の完了数カウンター -->

  <!-- メインコンテンツ -->
  <main class="max-w-2xl mx-auto w-full px-4 pt-5 space-y-6 flex-1">

    <!-- 1. 今月のタスク -->
    <section class="space-y-2.5">

      <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">

      <form id="task-form" onsubmit="handleTaskSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">タスクの分類 <span class="text-red-500">*</span></label>

                <i data-lucide="calendar" class="w-4 h-4"></i>
                今月
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="category" value="today" class="peer sr-only" checked>
              <div class="text-center py-2.5 px-2 rounded-xl border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50/80 peer-checked:text-emerald-700 text-xs font-bold text-slate-600 transition-all active:scale-95 flex flex-col items-center gap-1">
                <i data-lucide="sun" class="w-4 h-4"></i>
                今日

            </label>
            <label class="cursor-pointer">
              <input type="radio" name="category" value="year" class="peer sr-only">
              <div class="text-center py-2.5 px-2 rounded-xl border-2 border-slate-200 peer-checked:border-purple-500 peer-checked:bg-purple-50/80 peer-checked:text-purple-700 text-xs font-bold text-slate-600 transition-all active:scale-95 flex flex-col items-center gap-1">

        </div>

        <div>
          <label for="task-note" class="block text-xs font-bold text-slate-600 mb-1">メモ (任意)</label>

        <div class="border-t border-slate-100 pt-3.5">

            <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <i data-lucide="repeat" class="w-4 h-4 text-indigo-600"></i>
              繰り返しタスクに設定

            <label class="relative inline-flex items-center cursor-pointer p-1">

              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[6px] after:left-[6px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>

          <div id="repeat-options" class="hidden space-y-3 pt-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80">
            <div>
              <label for="repeat-interval" class="block text-xs font-semibold text-slate-600 mb-1">繰り返しの頻度</label>

                <option value="daily">1日毎 (毎日発生)</option>
                <option value="weekly">1週間毎 (毎週)</option>
                <option value="monthly">1ヶ月毎 (毎月)</option>
                <option value="3months">3ヶ月毎</option>
                <option value="6months">6ヶ月毎</option>

            <div id="weekday-selector" class="hidden">

                <button type="button" onclick="toggleDayOfWeek(2)" data-day="2" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600">火</button>
                <button type="button" onclick="toggleDayOfWeek(3)" data-day="3" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600">水</button>
                <button type="button" onclick="toggleDayOfWeek(4)" data-day="4" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600">木</button>
                <button type="button" onclick="toggleDayOfWeek(5)" data-day="5" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600">金</button>
                <button type="button" onclick="toggleDayOfWeek(6)" data-day="6" class="day-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600">土</button>
              </div>

              <select id="repeat-monthday" class="w-full px-3 py-2.5 text-xs font-medium rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">

  <script>
    let tasks = [];
    let selectedDaysOfWeek = [1];
    let isCompletedOpen = false;
    let isUpcomingOpen = false;
    let editingTaskId = null;
    let isFirebaseReady = false;

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function calculateNextDueDate(task) {
      if (!task || !task.repeat || !task.repeat.enabled) return null;
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let baseDate = new Date(today);
      if (task.dueDate) {
        const parts = task.dueDate.split('-');
        if (parts.length === 3) {
          const taskDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          if (taskDate >= today) baseDate = taskDate;
        }
      }

      const repeat = task.repeat;

      if (repeat.interval === 'daily') {
        baseDate.setDate(baseDate.getDate() + 1);
      } else if (repeat.interval === 'weekly') {
        if (repeat.daysOfWeek && repeat.daysOfWeek.length > 0) {
          let nextDate = new Date(baseDate);
          nextDate.setDate(nextDate.getDate() + 1);
          while (!repeat.daysOfWeek.includes(nextDate.getDay())) {
            nextDate.setDate(nextDate.getDate() + 1);
          }
          baseDate = nextDate;
        } else {
          baseDate.setDate(baseDate.getDate() + 7);
        }
      } else if (['monthly', '3months', '6months'].includes(repeat.interval)) {
        let monthsToAdd = 1;
        if (repeat.interval === '3months') monthsToAdd = 3;
        if (repeat.interval === '6months') monthsToAdd = 6;

        let targetYear = baseDate.getFullYear();
        let targetMonth = baseDate.getMonth() + monthsToAdd;

        if (repeat.monthDay === 'last') {
          const lastDay = new Date(targetYear, targetMonth + 1, 0).getDate();
          baseDate = new Date(targetYear, targetMonth, lastDay);
        } else {
          const targetDay = parseInt(repeat.monthDay, 10) || baseDate.getDate();
          const maxDaysInMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
          const actualDay = Math.min(targetDay, maxDaysInMonth);
          baseDate = new Date(targetYear, targetMonth, actualDay);
        }
      }

      const y = baseDate.getFullYear();
      const m = String(baseDate.getMonth() + 1).padStart(2, '0');
      const d = String(baseDate.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function isTaskVisible(task) {
      if (task.completed) return false;
      const todayStr = getTodayString();
      if (task.dueDate && task.dueDate > todayStr) return false;
      return true;
    }

    // --- Firebase リアルタイム同期設定 ---
    window.initFirebaseSync = function() {
      if (!window.db || !window.fsOnSnapshot) return;
      isFirebaseReady = true;

      const tasksCol = window.fsCollection(window.db, "tasks");

      // リアルタイム購読（クラウド変更を即時反映）
      window.fsOnSnapshot(tasksCol, (snapshot) => {
        if (snapshot.empty) {
          // 初回のみデフォルトデータをFirestoreへ初期投入
          seedInitialFirestore();
          return;
        }

        const remoteTasks = [];
        snapshot.forEach((doc) => {
          remoteTasks.push(doc.data());
        });

        // order番号または作成日時でソート
        remoteTasks.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        tasks = remoteTasks;
        renderAllTasks();
      });
    };

    // クラウド保存
    async function syncTaskToCloud(task) {
      if (!isFirebaseReady) return;
      try {
        await window.fsSetDoc(window.fsDoc(window.db, "tasks", String(task.id)), task);
      } catch (e) {
        console.error("Firestore Save Error:", e);
      }
    }

    // クラウド削除
    async function deleteTaskFromCloud(taskId) {
      if (!isFirebaseReady) return;
      try {
        await window.fsDeleteDoc(window.fsDoc(window.db, "tasks", String(taskId)));
      } catch (e) {
        console.error("Firestore Delete Error:", e);
      }
    }

    // 初回初期データの投入
    function seedInitialFirestore() {
      const todayStr = getTodayString();
      const initialSeed = [
        {
          id: 'task-1',
          order: 1,
          title: '清掃事業者向けの見積りアプリの開発',
          note: '',
          category: 'month',
          completed: false,
          createdAt: todayStr,
          lastGeneratedDate: todayStr,
          dueDate: todayStr,
          repeat: { enabled: false }
        },
        {
          id: 'task-2',
          order: 2,
          title: '経営の羅針盤チェック 10分',
          note: '',
          category: 'today',
          completed: false,
          createdAt: todayStr,
          lastGeneratedDate: todayStr,
          dueDate: todayStr,
          repeat: { enabled: true, interval: 'daily' }
        },
        {
          id: 'task-3',
          order: 3,
          title: '8月分仕様を最終確認',
          note: '',
          category: 'today',
          completed: false,
          createdAt: todayStr,
          lastGeneratedDate: todayStr,
          dueDate: todayStr,
          repeat: { enabled: false }
        },
        {
          id: 'task-4',
          order: 4,
          title: 'リースキン1月度領収書帳簿入力',
          note: '',
          category: 'today',
          completed: false,
          createdAt: todayStr,
          lastGeneratedDate: todayStr,
          dueDate: todayStr,
          repeat: { enabled: false }
        },
        {
          id: 'task-5',
          order: 5,
          title: '月間10万円の収入を得る仕組みを作る',
          note: '',
          category: 'year',
          completed: false,
          createdAt: todayStr,
          lastGeneratedDate: todayStr,
          dueDate: todayStr,
          repeat: { enabled: false }
        }
      ];

      initialSeed.forEach(t => syncTaskToCloud(t));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('current-date-text').textContent = 
        `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日(${days[now.getDay()]})`;

      const monthdaySelect = document.getElementById('repeat-monthday');
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}日`;
        monthdaySelect.appendChild(opt);
      }
      const lastOpt = document.createElement('option');
      lastOpt.value = 'last';
      lastOpt.textContent = '月末日';
      monthdaySelect.appendChild(lastOpt);

      if (window.db) {
        window.initFirebaseSync();
      }
      renderAllTasks();
      updateDaysOfWeekUI();
    });

    function renderAllTasks() {
      renderCategoryList('month', 'list-month', 'badge-month');
      renderCategoryList('today', 'list-today', 'badge-today');
      renderCategoryList('year', 'list-year', 'badge-year');
      renderUpcomingList();
      renderCompletedList();

      const todayStr = getTodayString();
      const todayDone = tasks.filter(t => t.completed && t.completedAt === todayStr).length;
      document.getElementById('today-done-count').textContent = todayDone;

      lucide.createIcons();

      initSortable('list-month', 'month');
      initSortable('list-today', 'today');
      initSortable('list-year', 'year');
    }

    function renderCategoryList(categoryKey, containerId, badgeId) {
      const container = document.getElementById(containerId);
      const badge = document.getElementById(badgeId);

      const categoryTasks = tasks.filter(t => t.category === categoryKey && isTaskVisible(t));
      badge.textContent = `${categoryTasks.length}件`;

      if (categoryTasks.length === 0) {
        container.innerHTML = `
          <div class="py-4 px-3 border border-dashed border-slate-200 rounded-2xl text-center text-slate-400 text-xs">
            タスクはありません
          </div>
        `;
        return;
      }

      container.innerHTML = categoryTasks.map(task => {
        const repeatText = getRepeatLabel(task.repeat);
        
        return `
          <div id="task-card-${task.id}" class="task-item bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200/90 shadow-sm active:border-indigo-300 flex items-center gap-2.5">
            
            <div class="drag-handle cursor-grab active:cursor-grabbing p-1 text-slate-300 hover:text-indigo-600 active:text-indigo-700 touch-none flex items-center justify-center transition-colors">
              <i data-lucide="grip-vertical" class="w-4 h-4"></i>
            </div>

            <button onclick="completeTask('${task.id}')" aria-label="完了にする" class="flex-shrink-0 w-6 h-6 rounded-lg border-2 border-slate-300 hover:border-emerald-500 hover:bg-emerald-50 active:scale-90 flex items-center justify-center transition-all">
            </button>

            <div class="flex-1 min-w-0 cursor-pointer" onclick="openEditModal('${task.id}')">
              <div class="text-sm font-bold text-slate-800 leading-snug break-words hover:text-indigo-600 transition-colors">
                ${escapeHtml(task.title)}
              </div>
              
              ${task.note ? `<p class="text-xs text-slate-500 mt-0.5 leading-relaxed break-words">${escapeHtml(task.note)}</p>` : ''}

              ${task.repeat && task.repeat.enabled ? `
                <div class="mt-1.5 inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-[11px] font-semibold">
                  <i data-lucide="repeat" class="w-3 h-3"></i>
                  <span>${repeatText}</span>
                </div>
              ` : ''}
            </div>

            <button onclick="openEditModal('${task.id}')" aria-label="編集" class="p-1.5 text-slate-400 hover:text-indigo-600 active:scale-90 rounded-lg hover:bg-slate-100 transition-all">
              <i data-lucide="edit-3" class="w-4 h-4"></i>
            </button>

            <button onclick="deleteTask('${task.id}')" aria-label="削除" class="p-1.5 text-slate-400 hover:text-red-500 active:scale-90 rounded-lg hover:bg-slate-100 transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function initSortable(containerId, category) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (container._sortable) {
        container._sortable.destroy();
      }

      container._sortable = new Sortable(container, {
        handle: '.drag-handle',
        animation: 200,
        ghostClass: 'opacity-30',
        chosenClass: 'bg-indigo-50/80',
        onEnd: function (evt) {
          const { oldIndex, newIndex } = evt;
          if (oldIndex === newIndex || oldIndex === undefined || newIndex === undefined) return;

          const categoryTasks = tasks.filter(t => t.category === category && isTaskVisible(t));
          const [movedTask] = categoryTasks.splice(oldIndex, 1);
          categoryTasks.splice(newIndex, 0, movedTask);

          // 順序orderを更新してクラウド保存
          categoryTasks.forEach((t, idx) => {
            t.order = idx;
            syncTaskToCloud(t);
          });
        }
      });
    }

    function renderCompletedList() {
      const container = document.getElementById('list-completed');
      const countSpan = document.getElementById('completed-count');
      const completedTasks = tasks.filter(t => t.completed);

      countSpan.textContent = completedTasks.length;

      if (completedTasks.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-3">完了したタスクはありません</p>`;
        return;
      }

      container.innerHTML = completedTasks.map(task => `
        <div class="bg-slate-200/60 p-3 rounded-xl flex items-center justify-between text-xs text-slate-500">
          <div class="flex items-center gap-2 min-w-0 flex-1 pr-2">
            <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500 flex-shrink-0"></i>
            <span class="line-through truncate">${escapeHtml(task.title)}</span>
          </div>
          <button onclick="restoreTask('${task.id}')" class="text-indigo-600 hover:underline text-[11px] font-bold flex-shrink-0">
            元に戻す
          </button>
        </div>
      `).join('');
    }

    function completeTask(id) {
      const card = document.getElementById(`task-card-${id}`);
      if (card) {
        card.classList.add('removing');
      }

      setTimeout(() => {
        const todayStr = getTodayString();
        let targetTask = tasks.find(t => t.id === id);
        if (!targetTask) return;

        targetTask.completed = true;
        targetTask.completedAt = todayStr;
        syncTaskToCloud(targetTask);

        if (targetTask.repeat && targetTask.repeat.enabled) {
          generateNextRepeatTask(targetTask);
        }
      }, 250);
    }

    function generateNextRepeatTask(baseTask) {
      const todayStr = getTodayString();
      const nextDueDate = calculateNextDueDate(baseTask);
      
      const newNextTask = {
        ...baseTask,
        id: Date.now().toString(),
        order: Date.now(),
        completed: false,
        completedAt: null,
        createdAt: todayStr,
        lastGeneratedDate: todayStr,
        dueDate: nextDueDate
      };

      syncTaskToCloud(newNextTask);
    }

    function renderUpcomingList() {
      const container = document.getElementById('list-upcoming');
      const countSpan = document.getElementById('upcoming-count');
      const todayStr = getTodayString();

      const upcomingTasks = tasks.filter(t => !t.completed && t.dueDate && t.dueDate > todayStr);
      countSpan.textContent = upcomingTasks.length;

      if (upcomingTasks.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-3">待機中の繰り返しタスクはありません</p>`;
        return;
      }

      container.innerHTML = upcomingTasks.map(task => {
        let formattedDate = task.dueDate;
        if (task.dueDate) {
          const p = task.dueDate.split('-');
          if (p.length === 3) formattedDate = `${parseInt(p[1], 10)}月${parseInt(p[2], 10)}日`;
        }

        return `
          <div class="bg-indigo-50/60 border border-indigo-100 p-3 rounded-xl flex items-center justify-between text-xs text-slate-700">
            <div class="flex items-center gap-2 min-w-0 flex-1 pr-2">
              <i data-lucide="clock" class="w-4 h-4 text-indigo-500 flex-shrink-0"></i>
              <span class="font-bold truncate">${escapeHtml(task.title)}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-md text-[11px] flex-shrink-0">
                次回: ${formattedDate}
              </span>
              <button onclick="openEditModal('${task.id}')" class="text-slate-400 hover:text-indigo-600 p-1 rounded">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleUpcomingSection() {
      isUpcomingOpen = !isUpcomingOpen;
      const container = document.getElementById('upcoming-list-container');
      const chevron = document.getElementById('upcoming-chevron');

      if (isUpcomingOpen) {
        container.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        container.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
    }

    function restoreTask(id) {
      const target = tasks.find(t => t.id === id);
      if (target) {
        target.completed = false;
        syncTaskToCloud(target);
      }
    }

    function deleteTask(id) {
      const card = document.getElementById(`task-card-${id}`);
      if (card) {
        card.classList.add('removing');
        setTimeout(() => {
          deleteTaskFromCloud(id);
        }, 200);
      } else {
        deleteTaskFromCloud(id);
      }
    }

    function toggleCompletedSection() {
      isCompletedOpen = !isCompletedOpen;
      const container = document.getElementById('completed-list-container');
      const chevron = document.getElementById('completed-chevron');

      if (isCompletedOpen) {
        container.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        container.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
    }

    function getRepeatLabel(repeat) {
      if (!repeat || !repeat.enabled) return '';
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      
      switch (repeat.interval) {
        case 'daily':
          return '1日毎 (毎日)';
        case 'weekly':
          if (repeat.daysOfWeek && repeat.daysOfWeek.length > 0) {
            const days = repeat.daysOfWeek.map(d => dayNames[d]).join('・');
            return `1週間毎 (${days})`;
          }
          return '1週間毎';
        case 'monthly':
          const mDay = repeat.monthDay === 'last' ? '月末' : `${repeat.monthDay}日`;
          return `1ヶ月毎 (${mDay})`;
        case '3months':
          const mDay3 = repeat.monthDay === 'last' ? '月末' : `${repeat.monthDay}日`;
          return `3ヶ月毎 (${mDay3})`;
        case '6months':
          const mDay6 = repeat.monthDay === 'last' ? '月末' : `${repeat.monthDay}日`;
          return `6ヶ月毎 (${mDay6})`;
        default:
          return '繰り返し';
      }
    }

    function openModal(defaultCategory = 'today') {
      editingTaskId = null;
      document.getElementById('task-form').reset();
      
      document.getElementById('modal-heading').querySelector('span').textContent = '新しいタスクを追加';
      document.getElementById('modal-submit-btn').querySelector('span').textContent = 'タスクを保存する';
      
      const categoryRadio = document.querySelector(`input[name="category"][value="${defaultCategory}"]`);
      if (categoryRadio) categoryRadio.checked = true;

      document.getElementById('repeat-toggle').checked = false;
      selectedDaysOfWeek = [1];
      updateDaysOfWeekUI();
      toggleRepeatFields();

      showModalUI();
    }

    function openEditModal(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      editingTaskId = taskId;
      document.getElementById('task-form').reset();

      document.getElementById('modal-heading').querySelector('span').textContent = 'タスクを編集';
      document.getElementById('modal-submit-btn').querySelector('span').textContent = '変更を保存する';

      document.getElementById('task-title').value = task.title || '';
      document.getElementById('task-note').value = task.note || '';

      const categoryRadio = document.querySelector(`input[name="category"][value="${task.category}"]`);
      if (categoryRadio) categoryRadio.checked = true;

      const isRepeat = !!(task.repeat && task.repeat.enabled);
      document.getElementById('repeat-toggle').checked = isRepeat;

      if (isRepeat) {
        document.getElementById('repeat-interval').value = task.repeat.interval || 'daily';
        if (task.repeat.daysOfWeek) {
          selectedDaysOfWeek = [...task.repeat.daysOfWeek];
        }
        if (task.repeat.monthDay) {
          document.getElementById('repeat-monthday').value = task.repeat.monthDay;
        }
      } else {
        selectedDaysOfWeek = [1];
      }

      updateDaysOfWeekUI();
      toggleRepeatFields();
      showModalUI();
    }

    function showModalUI() {
      const backdrop = document.getElementById('modal-backdrop');
      const container = document.getElementById('modal-container');

      backdrop.classList.remove('pointer-events-none');
      backdrop.classList.replace('opacity-0', 'opacity-100');
      container.classList.replace('translate-y-full', 'translate-y-0');
      container.classList.replace('sm:translate-y-4', 'sm:translate-y-0');

      lucide.createIcons();
      setTimeout(() => document.getElementById('task-title').focus(), 150);
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const container = document.getElementById('modal-container');

      backdrop.classList.replace('opacity-100', 'opacity-0');
      container.classList.replace('translate-y-0', 'translate-y-full');
      container.classList.replace('sm:translate-y-0', 'sm:translate-y-4');

      setTimeout(() => {
        backdrop.classList.add('pointer-events-none');
        editingTaskId = null;
      }, 200);
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    }

    function toggleRepeatFields() {
      const isChecked = document.getElementById('repeat-toggle').checked;
      const optionsDiv = document.getElementById('repeat-options');
      
      if (isChecked) {
        optionsDiv.classList.remove('hidden');
        handleIntervalChange();
      } else {
        optionsDiv.classList.add('hidden');
      }
    }

    function handleIntervalChange() {
      const interval = document.getElementById('repeat-interval').value;
      const weekdaySelector = document.getElementById('weekday-selector');
      const monthdaySelector = document.getElementById('monthday-selector');

      if (interval === 'weekly') {
        weekdaySelector.classList.remove('hidden');
        monthdaySelector.classList.add('hidden');
      } else if (['monthly', '3months', '6months'].includes(interval)) {
        weekdaySelector.classList.add('hidden');
        monthdaySelector.classList.remove('hidden');
      } else {
        weekdaySelector.classList.add('hidden');
        monthdaySelector.classList.add('hidden');
      }
    }

    function toggleDayOfWeek(dayIndex) {
      if (selectedDaysOfWeek.includes(dayIndex)) {
        if (selectedDaysOfWeek.length > 1) {
          selectedDaysOfWeek = selectedDaysOfWeek.filter(d => d !== dayIndex);
        }
      } else {
        selectedDaysOfWeek.push(dayIndex);
      }
      updateDaysOfWeekUI();
    }

    function updateDaysOfWeekUI() {
      const buttons = document.querySelectorAll('.day-btn');
      buttons.forEach(btn => {
        const day = parseInt(btn.getAttribute('data-day'), 10);
        if (selectedDaysOfWeek.includes(day)) {
          btn.className = 'day-btn flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition-all shadow-sm';
        } else {
          btn.className = 'day-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600 transition-all';
        }
      });
    }

    function handleTaskSubmit(e) {
      e.preventDefault();

      const title = document.getElementById('task-title').value.trim();
      const note = document.getElementById('task-note').value.trim();
      const category = document.querySelector('input[name="category"]:checked').value;
      
      const isRepeat = document.getElementById('repeat-toggle').checked;
      const interval = document.getElementById('repeat-interval').value;
      const monthDay = document.getElementById('repeat-monthday').value;

      if (!title) return;

      const todayStr = getTodayString();

      if (editingTaskId) {
        const target = tasks.find(t => t.id === editingTaskId);
        if (target) {
          const updated = {
            ...target,
            title: title,
            note: note,
            category: category,
            repeat: {
              enabled: isRepeat,
              interval: interval,
              daysOfWeek: selectedDaysOfWeek,
              monthDay: monthDay
            }
          };
          syncTaskToCloud(updated);
        }
      } else {
        const newTask = {
          id: Date.now().toString(),
          order: Date.now(),
          title: title,
          note: note,
          category: category,
          completed: false,
          createdAt: todayStr,
          lastGeneratedDate: todayStr,
          dueDate: todayStr,
          repeat: {
            enabled: isRepeat,
            interval: interval,
            daysOfWeek: selectedDaysOfWeek,
            monthDay: monthDay
          }
        };
        syncTaskToCloud(newTask);
      }

      closeModal();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
